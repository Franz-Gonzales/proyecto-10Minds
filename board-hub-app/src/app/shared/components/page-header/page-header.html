<div class="flex items-start justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold text-base-content">{{ title() }}</h1>
    @if (subtitle()) {
    <p class="text-sm text-base-content/60 mt-1">{{ subtitle() }}</p>
    }
  </div>

  @if (actionLabel()) {
    <app-button-dialog
      actionLabel="{{ actionLabel() }}"
      actionIcon="add"
      (action)="openCreateDialog()"
    />
  }
</div>
