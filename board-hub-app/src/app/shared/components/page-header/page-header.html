<div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 sm:gap-4 mb-4 sm:mb-6">
  <div class="min-w-0">
    <h1 class="text-xl sm:text-2xl font-bold text-base-content truncate">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="text-xs sm:text-sm text-base-content/60 mt-1 line-clamp-2">{{ subtitle() }}</p>
    }
  </div>

  @if (actionLabel()) {
    <div class="shrink-0">
      <app-button-dialog
        actionLabel="{{ actionLabel() }}"
        actionIcon="add"
        (action)="openCreateDialog()"
      />
    </div>
  }
</div>
