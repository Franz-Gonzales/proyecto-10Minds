<button
  mat-fab
  extended
  [class]="tailwindClasses()"
  [disabled]="disabled()"
  (click)="clicked.emit()">

  @if (icon()) {
    <mat-icon class="!mr-1 !w-6 !h-6 sm:!w-5 sm:!h-5 !text-[24px] sm:!text-[20px]">{{ icon() }}</mat-icon>
  }

  <span class="font-medium tracking-wide text-base sm:text-sm">
    {{ label() }}
  </span>
</button>
