<div class="flex h-screen overflow-hidden bg-base-100">

  <!-- Desktop Sidebar (hidden on mobile) -->
  <div class="hidden md:block">
    <app-sidebar [collapsed]="sidebarCollapsed()" />
  </div>

  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm md:hidden"
      (click)="closeMobileSidebar()"
    ></div>
  }

  <!-- Mobile Sidebar (slide-in drawer) -->
  <div
    class="fixed inset-y-0 left-0 z-50 md:hidden transition-transform duration-300 ease-snappy"
    [class]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <app-sidebar [collapsed]="true" />
  </div>

  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <app-topbar (toggleSidebar)="toggleSidebar()" />

    <main class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
