<app-page-header
  title="Préstamos"
  subtitle="Gestiona los préstamos de juegos de mesa"
  actionLabel="Nuevo préstamo"
  actionIcon="add"
  (action)="openCreateDialog()"
/>

<app-loan-filters
  [activeStatus]="activeStatus()"
  [searchTerm]="searchTerm()"
  (statusChange)="onStatusChange($event)"
  (searchChange)="onSearchChange($event)"
/>

@if (loading()) {
  <div class="flex items-center justify-center py-20">
    <div class="flex flex-col items-center gap-3">
      <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm text-base-content/50">Cargando préstamos...</span>
    </div>
  </div>
} @else if (!selectedClient()) {
  <!-- ═══════ GENERAL VIEW: One row per client ═══════ -->
  @if (filteredLoans().length === 0) {
    <app-empty-state
      [title]="searchTerm()
        ? 'No hay resultados para &quot;' + searchTerm() + '&quot;'
        : activeStatus()
          ? 'No hay préstamos con este estado'
          : 'No hay préstamos registrados'"
      [subtitle]="searchTerm()
        ? 'Intenta con otro término de búsqueda'
        : 'Comienza creando un nuevo préstamo'"
      [icon]="searchTerm() ? 'search_off' : 'receipt_long'"
    />
  } @else {
    <app-list-loans
      [loans]="filteredLoans()"
      (viewClientLoans)="onViewClientLoans($event)"
    />
  }
} @else {
  <!-- ═══════ CLIENT DETAIL VIEW: All loans for one client ═══════ -->
  @if (clientLoans().length === 0) {
    <app-loans-client
      [loans]="[]"
      [clientName]="selectedClient()!.clientName + ' ' + selectedClient()!.clientLastName"
      (back)="onBackToGeneral()"
      (edit)="openEditDialog($event)"
      (deleteLoan)="onDeleteLoan($event)"
      (returnLoan)="onReturnLoan($event)"
      (revertLoan)="onRevertLoan($event)"
    />
  } @else {
    <app-loans-client
      [loans]="clientLoans()"
      [clientName]="selectedClient()!.clientName + ' ' + selectedClient()!.clientLastName"
      (back)="onBackToGeneral()"
      (edit)="openEditDialog($event)"
      (deleteLoan)="onDeleteLoan($event)"
      (returnLoan)="onReturnLoan($event)"
      (revertLoan)="onRevertLoan($event)"
    />
  }
}
