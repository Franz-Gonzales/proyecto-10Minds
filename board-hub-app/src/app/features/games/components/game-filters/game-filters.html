<div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-4 sm:mb-6">
  <!-- Search -->
  <div class="relative w-full sm:w-64 sm:order-2 sm:ml-auto">
    <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-[18px]!">
      search
    </mat-icon>
    <input
      type="text"
      placeholder="Buscar por nombre.."
      class="w-full pl-10 pr-4 py-2 bg-base-200 border border-base-300 rounded-lg text-sm text-base-content placeholder:text-base-content/40 focus:outline-none focus:border-primary"
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearch($event)"
    />
  </div>

  <!-- Category tabs -->
  <div class="flex flex-nowrap gap-1.5 sm:gap-2 sm:order-1 overflow-x-auto pb-1 -mx-1 px-1 scrollbar-none">
    @for (tab of tabs(); track tab.value) {
      <button
        (click)="selectCategory(tab.value)"
        class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors whitespace-nowrap shrink-0"
        [class]="
          activeCategoryId() === tab.value
            ? 'bg-primary text-primary-content'
            : 'bg-base-200 text-base-content/70 hover:bg-base-300'
        "
      >
        {{ tab.label }}
      </button>
    }
  </div>
</div>
