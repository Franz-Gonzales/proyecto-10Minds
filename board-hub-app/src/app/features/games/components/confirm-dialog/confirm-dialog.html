<h2 mat-dialog-title class="text-base-content">{{ data.title }}</h2>

<mat-dialog-content>
  <p class="text-base-content/70 text-sm">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(false)">
    {{ data.cancelLabel ?? 'Cancelar' }}
  </button>
  <button
    mat-flat-button
    [color]="data.confirmColor ?? 'primary'"
    (click)="dialogRef.close(true)"
  >
    {{ data.confirmLabel ?? 'Confirmar' }}
  </button>
</mat-dialog-actions>
