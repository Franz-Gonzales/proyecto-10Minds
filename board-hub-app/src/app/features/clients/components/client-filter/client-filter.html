<div class="w-full flex justify-end mb-6">
  <div class="relative w-full sm:w-80">
    <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-[18px]!">
      search
    </mat-icon>
    <input
      type="text"
      placeholder="Buscar por nombre, CI, teléfono o correo..."
      class="w-full pl-10 pr-4 py-2 bg-base-200 border border-base-300 rounded-lg text-sm text-base-content placeholder:text-base-content/40 focus:outline-none focus:border-primary transition-colors"
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearch($event)"
    />
  </div>
</div>
